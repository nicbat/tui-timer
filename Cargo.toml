[package]
name = "tui-timer"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[features]
metrics = []
